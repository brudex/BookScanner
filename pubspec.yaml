name: bookscanner
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  archive: ^4.0.9
  camera: ^0.12.1
  collection: ^1.19.1
  crypto: ^3.0.7
  cunning_document_scanner: ^3.0.3
  file_picker: ^12.0.0-beta.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  image: ^4.0.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  local_auth: ^3.0.2
  lucide_icons_flutter: ^3.1.20
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  permission_handler: ^12.0.3
  printing: ^5.14.3
  share_plus: ^13.2.1
  sqflite: ^2.4.2+1
  uuid: ^4.6.0
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  path_provider_platform_interface: ^2.1.3
  permission_handler_platform_interface: ^4.3.0
  local_auth_platform_interface: ^1.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/onboarding/
    - assets/icons/
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
